name: Build Cheatsheets and Quizzes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  cheatsheet-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subject: [chemistry, biology]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build cheatsheet for ${{ matrix.subject }}
        run: python src/child_review_agent.py --subject ${{ matrix.subject }}

  quiz-agent:
    needs: cheatsheet-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subject: [chemistry, biology]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tag difficulty for ${{ matrix.subject }}
        run: python src/difficulty_tagger.py --subject ${{ matrix.subject }}
