name: Build Cheatsheets and Quizzes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cheatsheet-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subject: [chemistry, biology]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/child_review_agent.py --subject ${{ matrix.subject }}

  quiz-agent:
    needs: cheatsheet-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subject: [chemistry, biology]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/difficulty_tagger.py --subject ${{ matrix.subject }} 
